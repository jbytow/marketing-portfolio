<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before the first paint so neither Rose nor Dark users see the other theme flash
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme !== 'dark') document.documentElement.setAttribute('data-theme', 'rose');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'rose');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional marketing portfolio showcasing campaigns, case studies, and expertise" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Henny+Penny&family=Eagle+Lake&display=swap" rel="stylesheet">
    <title>Marketing Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
