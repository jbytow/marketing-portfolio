version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-network-prod
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS is required}
      UPLOAD_PATH: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    volumes:
      - uploads_data_prod:/app/uploads
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-network-prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: portfolio-frontend-prod
    container_name: portfolio-frontend-prod
    volumes:
      # Accumulated assets of past builds (see frontend/deploy.sh); shadows the dist baked into the image
      - ./frontend/www:/usr/share/nginx/html:ro
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - portfolio-network-prod
    restart: unless-stopped

  nginx:
    # Pinned: upstream "resolve" in nginx/nginx.conf needs nginx >= 1.27.3
    image: nginx:1.30-alpine
    container_name: portfolio-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network-prod
    restart: unless-stopped

volumes:
  postgres_data_prod:
  uploads_data_prod:

networks:
  portfolio-network-prod:
    driver: bridge
